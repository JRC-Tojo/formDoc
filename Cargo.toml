[workspace]
resolver = "3"
members = ["crates/*", "ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# Web版エンジンの配布用ビルド。ダウンロード量を減らすため、速度より大きさを優先する
[profile.wasm-release]
inherits = "release"
opt-level = "z"

# Web版エンジンの開発用ビルド（LTOなしで高速）
[profile.wasm-dev]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
