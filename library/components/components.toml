# 部品（ブロック）定義。GUIの入力フォームはこの定義から自動生成される。
# category: 「部品を追加」ダイアログの分類
# field.type: text / multiline / date / number / int / expr / var / varlist / select / bool / kijun / table / json / file
# 描画は library/typst/formdoc の関数で行い、Typstコード生成は formdoc-core::codegen が担う。

[heading]
label = "見出し"
category = "文章"
icon = "H"
help = "章・節の見出し。番号（§4． / 4.1 / (1) / 1)）は自動で付く。"
fields = [
  { key = "level", label = "階層", type = "select", options = ["1", "2", "3", "4"], default = "2", required = true },
  { key = "text", label = "見出し文", type = "text", required = true },
  { key = "symbol", label = "記号", type = "text", help = "作用の記号など（例: D, I, L_F）" },
  { key = "kijun", label = "基準引用", type = "kijun", help = "右寄せで【鋼標準】第Ⅰ編 4.4.2 より を表示" },
]

[paragraph]
label = "本文"
category = "文章"
icon = "¶"
help = "本文の段落。{{L_b}} のように書くと変数の値（単位付き）が入る。"
fields = [
  { key = "text", label = "本文", type = "multiline", required = true },
]

[kijun]
label = "基準引用"
category = "文章"
icon = "【】"
help = "基準書の引用行。略称は登録済みのものから選ぶ。"
fields = [
  { key = "kijun", label = "基準", type = "kijun", required = true },
  { key = "prefix", label = "前置きの文", type = "text", help = "例: 軸圧縮力を受ける板要素の照査（片縁支持板）" },
]

[vdef]
label = "変数定義"
category = "計算"
icon = "x="
help = "設計条件などの値を変数として定義する。以降の計算で名前を使って参照できる。"
fields = [
  { key = "name", label = "変数名", type = "var", required = true, help = "半角英字で始まる名前。添字は _ で（L_b, sigma_ck, gamma_f）" },
  { key = "value", label = "値", type = "number", required = true },
  { key = "unit", label = "単位", type = "text", help = "kN, kN/m, N/mm2, m, mm …" },
  { key = "digits", label = "小数桁数", type = "int", help = "空欄なら単位ごとの既定値" },
  { key = "desc", label = "説明", type = "text", help = "「ここに，」に表示される説明" },
  { key = "display", label = "表示記号", type = "text", help = "数式表記を変える場合のみ（Typst数式。例: (b/t)_0）" },
  { key = "label", label = "左の見出し", type = "text" },
  { key = "show", label = "本文に表示", type = "bool", default = true },
  { key = "global", label = "グローバル変数として定義", type = "bool", default = false, help = "チェックしないと、同じ見出し（節）・部品テンプレートの中だけで使えるローカル変数になる" },
]

[calc]
label = "計算"
category = "計算"
icon = "="
help = "式から値を計算し、「記号式 = 代入式 = 結果」の形で表示する。"
fields = [
  { key = "name", label = "変数名", type = "var", required = true },
  { key = "expr", label = "式", type = "expr", required = true, help = "例: w * L^2 / 8、R_cr * sqrt(pi^2 * k_0 / (12 * (1 - nu^2)) * E / f_syk)" },
  { key = "unit", label = "単位", type = "text" },
  { key = "digits", label = "小数桁数", type = "int" },
  { key = "desc", label = "説明", type = "text" },
  { key = "display", label = "表示記号", type = "text" },
  { key = "label", label = "左の見出し", type = "text" },
  { key = "frac", label = "割り算を分数で表示", type = "bool", default = true },
  { key = "units_in_sub", label = "代入式に単位を表示", type = "bool", default = false },
  { key = "show_symbolic", label = "記号式を表示", type = "bool", default = true },
  { key = "show", label = "本文に表示", type = "bool", default = true },
  { key = "global", label = "グローバル変数として定義", type = "bool", default = false, help = "チェックしないと、同じ見出し（節）・部品テンプレートの中だけで使えるローカル変数になる" },
]

[sum]
label = "内訳と合計"
category = "計算"
icon = "Σ"
help = "荷重の内訳などを列挙し、下線の下に合計を表示する。"
fields = [
  { key = "items", label = "内訳", type = "table", columns = [
      { key = "label", label = "名称", type = "text" },
      { key = "name", label = "変数名", type = "var" },
      { key = "expr", label = "式", type = "expr" },
  ] },
  { key = "name", label = "合計の変数名", type = "var", required = true },
  { key = "unit", label = "単位", type = "text" },
  { key = "digits", label = "小数桁数", type = "int" },
  { key = "desc", label = "合計の説明", type = "text" },
  { key = "global", label = "グローバル変数として定義（内訳と合計）", type = "bool", default = false, help = "チェックしないと、同じ見出し（節）・部品テンプレートの中だけで使えるローカル変数になる" },
]

[check]
label = "照査"
category = "計算"
icon = "≦"
help = "比較式を評価し、紙面上の値どうしで OK / NG を自動判定する。"
fields = [
  { key = "expr", label = "照査式", type = "expr", required = true, help = "例: b / t <= bt_0、M_d / M_ud <= 1.0" },
  { key = "digits", label = "小数桁数", type = "int" },
  { key = "unit", label = "単位", type = "text" },
  { key = "lhs", label = "左辺の表示記号", type = "text", help = "Typst数式（例: (b/t)）" },
  { key = "label", label = "左の見出し", type = "text" },
]

[where]
label = "記号説明"
category = "計算"
icon = "ここに"
help = "「ここに，」の記号説明。変数を空にすると、直前の計算で使った変数を自動で並べる。"
fields = [
  { key = "vars", label = "変数", type = "varlist" },
]

[table]
label = "表"
category = "図表"
icon = "▦"
help = "番号付きの表。セルに {{変数名}} と書くと値が入る。セルの結合・縦書きは各セルの設定で。"
fields = [
  { key = "caption", label = "表題", type = "text" },
  { key = "data", label = "表", type = "grid" },
]

[fig-shapes]
label = "図：汎用図形"
category = "図表"
icon = "◇"
help = "線・矢印・矩形・円・多角形・寸法線・文字。「図を描く」で描きながら作れる。座標に変数や式を使うと、値に合わせて形が変わる。図形ごとに縦横の繰り返し（回数・間隔）を指定でき、式の中で繰り返しの番号 ix・iy（0始まり）を使える。文字には {{変数}} のほか {{式}}・{{式:桁}} も書ける。"
fields = [
  { key = "shapes", label = "図形", type = "table", columns = [
      { key = "kind", label = "種類", type = "select", options = ["line", "arrow", "rect", "circle", "polygon", "dim", "text"] },
      { key = "x1", label = "x1", type = "expr" },
      { key = "y1", label = "y1", type = "expr" },
      { key = "x2", label = "x2 / 半径", type = "expr" },
      { key = "y2", label = "y2", type = "expr" },
      { key = "pts", label = "頂点（多角形）", type = "expr", help = "x, y; x, y; …" },
      { key = "label", label = "文字", type = "text" },
      { key = "fill", label = "塗り", type = "select", options = ["", "gray", "dark", "black"] },
      { key = "nx", label = "横の回数", type = "expr", help = "繰り返し（空欄は1回）" },
      { key = "dx", label = "横の間隔", type = "expr" },
      { key = "ny", label = "縦の回数", type = "expr" },
      { key = "dy", label = "縦の間隔", type = "expr" },
  ] },
  { key = "scale", label = "縮尺（1単位=cm）", type = "number", default = 1.0 },
  { key = "caption", label = "図題", type = "text" },
]

[image]
label = "画像"
category = "図表"
icon = "🖼"
help = "CAD図・写真・既存資料のPDFなど（PNG / JPG / SVG / PDF）。PDFはスクリーンショットではなく元データのまま挿入される。"
fields = [
  { key = "file", label = "ファイル", type = "file", required = true },
  { key = "page", label = "PDFのページ", type = "int", default = 1, help = "PDFを選んだ場合に挿入するページ" },
  { key = "width", label = "幅（%）", type = "int", default = 80 },
  { key = "caption", label = "図題", type = "text" },
]

[group]
label = "部品テンプレート"
icon = "❖"
category = "その他"
help = "挿入した部品テンプレートのまとまり。中の変数はこの中だけで使え、「公開する変数」だけが後ろの部品から使える。"
fields = [
  { key = "title", label = "名前", type = "text" },
  { key = "exports", label = "公開する変数", type = "varlist", help = "部品テンプレートの中で定義した変数のうち、外から使えるもの" },
]

[pagebreak]
label = "改ページ"
category = "その他"
icon = "⏎"
fields = []

[typst]
label = "Typstコード"
category = "その他"
icon = "</>"
help = "上級者向け。Typstを直接書く。社内標準パッケージの関数と、定義済み変数（v-変数名）を使える。"
fields = [
  { key = "code", label = "コード", type = "code", required = true },
]
