[package]
name = "formdoc-wasm"
version.workspace = true
edition.workspace = true
description = "Web版のための wasm-bindgen ラッパー。Web Worker 内で formdoc-core を動かす"

[lib]
crate-type = ["cdylib"]

[dependencies]
# フォントは埋め込まず、Worker が取得して init_fonts で渡す（wasm の軽量化）
formdoc-core = { path = "../formdoc-core", default-features = false }
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
